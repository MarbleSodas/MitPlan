name: CI

on:
  pull_request:
    branches: [main, rebuild, dev]
  push:
    branches: [main, rebuild, dev]

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ADR-0002 Path A: the compliance gate below is the architectural-lock
# enforcement. It fails any PR that re-introduces a Path B dependency
# (Hocuspocus, Hono, tRPC, Upstash, Cloudflare Workers/DO) or a Path B
# directory (apps/realtime, apps/server, apps/act-ingester).
#
# Per architecture §22.1: CI is green on the initial commit.
# Per §22.2: typecheck + test pass; the smoke job runs a credential-free
# browser check. Authenticated collaboration runs against staging separately.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

  compliance:
    # ADR-0002 §"Compliance" (Path A enforcement). Fails any PR that
    # re-introduces Path B technology or the cut-list directories.
    name: ADR-0002 compliance gate
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block Hocuspocus, y-partyserver, partykit
        run: |
          set -e
          echo "Checking for prohibited realtime dependencies..."
          if grep -rEn '("|@)(y-partyserver|partykit|hocuspocus)' --include='*.json' --include='*.ts' --include='*.tsx' --include='*.yaml' apps packages 2>/dev/null; then
            echo "::error::ADR-0002 §T-1 + ADR-0003: Hocuspocus, y-partyserver, partykit, and y-supabase are prohibited (Path A Hardened: own SupabaseBroadcastProvider only)."
            exit 1
          fi
      - name: Block Hono, tRPC, Upstash, Cloudflare Workers
        run: |
          set -e
          echo "Checking for prohibited API + cache + runtime dependencies..."
          if grep -rEn '("|@)(hono|@hono/|@trpc/|@upstash/|wrangler)' --include='*.json' --include='*.ts' --include='*.tsx' --include='*.yaml' apps packages 2>/dev/null | grep -v 'node_modules' | grep -v 'pnpm-lock'; then
            echo "::error::ADR-0002 §T-4 + §T-6 + §"Compliance": Hono, @hono/*, @trpc/*, @upstash/*, and wrangler are prohibited (Path A: PostgREST + Edge Functions only)."
            exit 1
          fi
      - name: Block apps/realtime, apps/server, apps/act-ingester
        run: |
          set -e
          echo "Checking for prohibited apps/ directories..."
          for d in apps/realtime apps/server apps/act-ingester; do
            if [ -d "$d" ]; then
              echo "::error::ADR-0002 §"Compliance": $d is prohibited (Path A: deleted)."
              exit 1
            fi
          done
      - name: Block wrangler configs outside apps/edge
        run: |
          set -e
          # apps/edge has supabase/config.toml, which is fine. Any other
          # wrangler.{toml,jsonc} is a sign someone reintroduced a
          # Cloudflare Worker.
          matches=$(find . -path ./node_modules -prune -o \( -name 'wrangler.toml' -o -name 'wrangler.jsonc' \) -print 2>/dev/null | grep -v 'node_modules' || true)
          if [ -n "$matches" ]; then
            echo "::error::ADR-0002 §"Compliance": wrangler.{toml,jsonc} files are prohibited (Path A: no Cloudflare Workers):"
            echo "$matches"
            exit 1
          fi
      - name: Block live_sessions, act_events, is_anonymous
        run: |
          set -e
          echo "Checking for cut-list tables/columns from ADR-0001..."
          if grep -rEn 'live_sessions|act_events|is_anonymous' --include='*.ts' --include='*.tsx' --include='*.sql' apps packages 2>/dev/null; then
            echo "::error::ADR-0001 §"Locked decisions": live_sessions, act_events, and is_anonymous are cut from v1 (Live mode deferred)."
            exit 1
          fi
      - name: Verify migration 0002_acl.sql deployed
        run: |
          set -e
          # The ACL gate + crdt validator must be in the migration set
          # (ADR-0002 §"Compliance" item 7/8).
          for m in 0001_xivmitplan_v1_initial.sql 0002_xivmitplan_v1_acl.sql 0003_xivmitplan_v1_rpcs.sql; do
            if [ ! -f "packages/persistence/migrations/$m" ]; then
              echo "::error::ADR-0002 §"Compliance": required migration $m is missing from packages/persistence/migrations/."
              exit 1
            fi
          done
          grep -q 'realtime.check_plan_access' packages/persistence/migrations/0002_xivmitplan_v1_acl.sql || {
            echo "::error::ADR-0002 §"Compliance": realtime.check_plan_access() function missing from 0002_xivmitplan_v1_acl.sql."
            exit 1
          }
          grep -q 'crdt_validate_plan_doc' packages/persistence/migrations/0002_xivmitplan_v1_acl.sql || {
            echo "::error::ADR-0002 §"Compliance": crdt_validate_plan_doc() function missing from 0002_xivmitplan_v1_acl.sql."
            exit 1
          }
      - name: Release artifact preflight
        run: bash ./scripts/release-preflight.sh

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
        continue-on-error: true # Phase 0: ESLint config TBD

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test --reporter=verbose
      - name: Upload coverage
        if: matrix.package != null
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: |
            packages/*/coverage
            apps/*/coverage
          retention-days: 7
        continue-on-error: true

  smoke:
    name: Playwright smoke
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Production collaboration is validated separately against staging with
    # real Supabase sessions and private-channel RLS from migration 0009.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @xivmitplan/web exec playwright install --with-deps chromium
      - run: pnpm --filter @xivmitplan/web test:e2e
        env:
          SMOKE_RUNS: 5
          WEB_BASE_URL: http://localhost:5173
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
